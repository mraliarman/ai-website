name: Build and validate
on:
	push:
		branches: [main]
	pull_request:
		branches: [main]
jobs:
	build:
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v5
				with:
					submodules: recursive
			- name: Setup Node.js
				uses: actions/setup-node@v5
				with:
					node-version: 22
					cache: npm
			- name: Install dependencies
				run: npm ci
			- name: Build site
				env:
					SITE_URL: https://example.com
				run: npm run build
